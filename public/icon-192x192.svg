<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7A3BFF"/>
      <stop offset="100%" style="stop-color:#5A30FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="24" fill="url(#bgGrad)"/>

  <!-- Film strip icon -->
  <g transform="translate(46, 46)">
    <!-- Main film body -->
    <rect x="0" y="0" width="100" height="100" rx="12" fill="url(#purpleGrad)"/>

    <!-- Center white band -->
    <rect x="35" y="8" width="30" height="84" fill="white" opacity="0.95"/>

    <!-- Film holes left -->
    <rect x="8" y="12" width="12" height="10" rx="2" fill="white"/>
    <rect x="8" y="30" width="12" height="10" rx="2" fill="white"/>
    <rect x="8" y="48" width="12" height="10" rx="2" fill="white"/>
    <rect x="8" y="66" width="12" height="10" rx="2" fill="white"/>
    <rect x="8" y="84" width="12" height="10" rx="2" fill="white"/>

    <!-- Film holes right -->
    <rect x="80" y="12" width="12" height="10" rx="2" fill="white"/>
    <rect x="80" y="30" width="12" height="10" rx="2" fill="white"/>
    <rect x="80" y="48" width="12" height="10" rx="2" fill="white"/>
    <rect x="80" y="66" width="12" height="10" rx="2" fill="white"/>
    <rect x="80" y="84" width="12" height="10" rx="2" fill="white"/>
  </g>
</svg>
