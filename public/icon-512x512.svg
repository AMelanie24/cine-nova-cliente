<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7A3BFF"/>
      <stop offset="100%" style="stop-color:#5A30FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

  <!-- Film strip icon -->
  <g transform="translate(106, 106)">
    <!-- Main film body -->
    <rect x="0" y="0" width="300" height="300" rx="36" fill="url(#purpleGrad)"/>

    <!-- Center white band -->
    <rect x="105" y="24" width="90" height="252" fill="white" opacity="0.95"/>

    <!-- Film holes left -->
    <rect x="24" y="36" width="36" height="30" rx="6" fill="white"/>
    <rect x="24" y="90" width="36" height="30" rx="6" fill="white"/>
    <rect x="24" y="144" width="36" height="30" rx="6" fill="white"/>
    <rect x="24" y="198" width="36" height="30" rx="6" fill="white"/>
    <rect x="24" y="252" width="36" height="30" rx="6" fill="white"/>

    <!-- Film holes right -->
    <rect x="240" y="36" width="36" height="30" rx="6" fill="white"/>
    <rect x="240" y="90" width="36" height="30" rx="6" fill="white"/>
    <rect x="240" y="144" width="36" height="30" rx="6" fill="white"/>
    <rect x="240" y="198" width="36" height="30" rx="6" fill="white"/>
    <rect x="240" y="252" width="36" height="30" rx="6" fill="white"/>
  </g>
</svg>
